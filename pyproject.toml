[project]
name = "cadquery-models"
version = "0.1.0"
description = "Parametric 3D CAD models built with CadQuery — source-of-truth scripts that export STEP files for SolidWorks."
requires-python = ">=3.10,<3.13"
dependencies = [
    "cadquery>=2.4",
    "ocp-vscode>=2.5",
    "shapely>=2.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
